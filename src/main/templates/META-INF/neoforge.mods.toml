modLoader="javafml" #mandatory
loaderVersion="${loader_version_range}" #mandatory
license="${mod_license}"

[[mods]] #mandatory
modId="${mod_id}" #mandatory
version="${mod_version}" #mandatory
displayName="${mod_name}" #mandatory
description='''
An addon for Buddycards that lets you challenge villagers to card battles,
decoupled from the two-playmat trigger.

Card names/stats/abilities/effects and several GUI assets are used with
explicit permission from wildcard_gamer. Credits: wildcard_gamer,
LegoMaster3650, agnor99. See https://github.com/wildcardgamez/Buddycards-Core
'''
authors="TODO: your name here"
credits="wildcard_gamer, LegoMaster3650, agnor99 (Buddycards) - card data, abilities, and GUI assets used with permission"

[[dependencies.${mod_id}]]
    modId="neoforge"
    type="required"
    versionRange="[${neo_version},)"
    ordering="NONE"
    side="BOTH"

[[dependencies.${mod_id}]]
    modId="minecraft"
    type="required"
    versionRange="${minecraft_version_range}"
    ordering="NONE"
    side="BOTH"

# This is the important one for an addon: require Buddycards itself, and load after it
# so its registries/config are already populated when we go looking for things like
# BuddycardItem / DeckboxItem.
[[dependencies.${mod_id}]]
    modId="buddycards"
    type="required"
    versionRange="[${buddycards_version},)"
    ordering="AFTER"
    side="BOTH"
